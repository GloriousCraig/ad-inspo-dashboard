name: Build and deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out the private data repo
        uses: actions/checkout@v4
        with:
          repository: GloriousCraig/ad-inspo-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data
      - name: Use real data if present
        run: |
          if [ -f private-data/ads.json ]; then
            cp private-data/ads.json data/ads.json
            echo "Using real data from the private repo."
          else
            echo "No real data yet. Building with the sample data."
          fi
          if [ -d private-data/images ]; then
            mkdir -p data/images
            cp -r private-data/images/. data/images/
            echo "Using $(ls data/images | wc -l) screenshot file(s) from the private repo."
          fi
          if [ -f private-data/insights.json ]; then
            cp private-data/insights.json data/insights.json
            echo "Using insights from the private repo."
          fi
      - name: Build encrypted page
        run: node build.mjs
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          # Temporary: no password. Delete the next line to lock the page again.
          DASHBOARD_PUBLIC: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
